name: daily-update
on:
  schedule:
    - cron: "30 23 * * *"   # 07:30 Beijing daily
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scraper.py
      - name: Deploy to Cloudflare Pages
        run: npx -y wrangler@latest pages deploy web --project-name fundboard --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Persist index history
        run: |
          git config user.name "fundboard-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/history.json web/data.json || true
          git diff --cached --quiet || git commit -m "daily data update"
          git push
