<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>美股指数基金日报 · 纳指100 / 标普500</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  .up{color:#dc2626}.down{color:#16a34a}
</style>
</head>
<body class="bg-slate-50 text-slate-800">
<div class="max-w-6xl mx-auto px-3 sm:px-6 py-6">
  <header class="mb-6">
    <h1 class="text-2xl sm:text-3xl font-bold">美股指数基金日报</h1>
    <p class="text-sm text-slate-500 mt-1">纳斯达克100 / 标普500 跟踪基金 · 每日净值 · 申购额度 · 加仓参考 <span id="updated" class="ml-2"></span></p>

  </header>

  <section id="idxCards" class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6"></section>

  <section class="mb-6">
    <div class="flex items-center justify-between mb-3">
      <h2 class="text-lg font-bold flex items-center gap-2">
        <span class="inline-block w-1.5 h-5 bg-amber-500 rounded"></span>全球产业数据
        <span class="px-2 py-0.5 rounded-full text-xs bg-blue-50 text-blue-600 border border-blue-100">美股盘后</span>
      </h2>
      <button id="secToggle" class="text-xs text-slate-500 hover:text-slate-700">收起 ▴</button>
    </div>
    <div id="secGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3"></div>
    <p class="text-xs text-slate-400 mt-2">各板块为对应美股代表性 ETF/个股等权平均隔夜涨跌幅，悬停可看成分。</p>
  </section>

  <section class="mb-4 flex flex-wrap items-center gap-2">
    <div id="tabs" class="inline-flex rounded-lg bg-white shadow-sm border border-slate-200 overflow-hidden text-sm">
      <button data-track="ALL" class="tab px-4 py-2">全部</button>
      <button data-track="NDX" class="tab px-4 py-2">纳指100</button>
      <button data-track="SPX" class="tab px-4 py-2">标普500</button>
    </div>
    <label class="text-sm text-slate-500 flex items-center gap-1 ml-2">
      <input type="checkbox" id="offOnly" class="accent-blue-600">仅场外（可申购）
    </label>
    <input id="q" placeholder="搜索名称/代码" class="ml-auto text-sm border border-slate-200 rounded-lg px-3 py-2 w-44 sm:w-56 bg-white">
  </section>

  <section class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-x-auto">
    <table class="min-w-full text-sm">
      <thead class="bg-slate-100 text-slate-500 select-none">
        <tr>
          <th class="px-3 py-2 text-left">基金</th>
          <th class="px-3 py-2 text-right cursor-pointer" data-sort="nav">最新净值</th>
          <th class="px-3 py-2 text-right cursor-pointer" data-sort="day_chg_pct">较前日 ▾</th>
          <th class="px-3 py-2 text-center">近10日</th>
          <th class="px-3 py-2 text-center">申购状态</th>
          <th class="px-3 py-2 text-center">限购额度</th>
          <th class="px-3 py-2 text-center">建议</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </section>

  <p class="text-xs text-slate-400 mt-4 leading-5">
    数据来源：天天基金/腾讯行情公开数据，每日自动更新；QDII 基金净值为 T-1/T-2 日。
    加仓建议为基于指数涨跌幅的规则化提示，<b>仅供参考，不构成任何投资建议</b>。市场有风险，投资需谨慎。
  </p>
</div>

<script>
let DATA=null, track='ALL', sortKey='day_chg_pct', sortDesc=true;

const fmt=(v,d=2)=>v==null||v===''?'--':(+v).toFixed(d);
const cls=v=>+v>0?'up':(+v<0?'down':'');
const sign=v=>(+v>0?'+':'')+fmt(v)+'%';

function spark(hist){
  if(!hist||hist.length<2) return '';
  const navs=hist.map(h=>+h.nav), min=Math.min(...navs), max=Math.max(...navs);
  const W=90,H=28,n=navs.length;
  const pts=navs.map((v,i)=>`${(i/(n-1)*W).toFixed(1)},${(H-3-(max===min?H/2:(v-min)/(max-min)*(H-6))).toFixed(1)}`).join(' ');
  const upTrend=navs[n-1]>=navs[0];
  return `<svg width="${W}" height="${H}"><polyline fill="none" stroke="${upTrend?'#dc2626':'#16a34a'}" stroke-width="1.5" points="${pts}"/></svg>`;
}

function statusBadge(s){
  if(!s) return '--';
  let c='bg-emerald-50 text-emerald-700';
  if(s.includes('暂停')) c='bg-red-50 text-red-600';
  else if(s.includes('限')) c='bg-amber-50 text-amber-700';
  else if(s.includes('场内')) c='bg-blue-50 text-blue-700';
  return `<span class="px-2 py-0.5 rounded-full text-xs ${c}">${s}</span>`;
}

function adviceBadge(a){
  const map={'大幅加仓':'bg-red-600 text-white','分批加仓':'bg-red-500 text-white','小幅加仓':'bg-orange-100 text-orange-700','正常定投':'bg-slate-100 text-slate-600','暂缓加仓':'bg-emerald-100 text-emerald-700','谨慎追高':'bg-emerald-600 text-white'};
  return `<span class="px-2 py-0.5 rounded-full text-xs ${map[a]||'bg-slate-100'}">${a}</span>`;
}

function render(){
  const q=document.getElementById('q').value.trim();
  const offOnly=document.getElementById('offOnly').checked;
  let rows=DATA.funds.filter(f=>(track==='ALL'||f.track===track)
    &&(!offOnly||!f.onmarket)
    &&(!q||f.name.includes(q)||f.code.includes(q)));
  rows.sort((a,b)=>{const x=+a[sortKey]||0,y=+b[sortKey]||0;return sortDesc?y-x:x-y;});
  document.getElementById('tbody').innerHTML=rows.map(f=>{
    const adv=DATA.advice[f.track]||{};
    return `<tr class="border-t border-slate-100 hover:bg-slate-50">
      <td class="px-3 py-2">
        <div class="font-medium">${f.name}</div>
        <div class="text-xs text-slate-400">${f.code} · ${f.track==='NDX'?'纳指100':'标普500'}${f.onmarket?' · 场内ETF':''}</div>
      </td>
      <td class="px-3 py-2 text-right">${fmt(f.nav,4)}<div class="text-xs text-slate-400">${f.nav_date||''}</div></td>
      <td class="px-3 py-2 text-right font-semibold ${cls(f.day_chg_pct)}">${sign(f.day_chg_pct)}</td>
      <td class="px-3 py-2 text-center">${spark(f.history)}</td>
      <td class="px-3 py-2 text-center">${statusBadge(f.buy_status)}</td>
      <td class="px-3 py-2 text-center text-xs">${f.purchase_limit||(f.onmarket?'场内不限':'--')}</td>
      <td class="px-3 py-2 text-center" title="${adv.reason||''}">${adviceBadge(adv.action||'--')}</td>
    </tr>`;
  }).join('')||'<tr><td colspan="7" class="px-3 py-8 text-center text-slate-400">无匹配基金</td></tr>';
  document.querySelectorAll('.tab').forEach(b=>{
    b.className='tab px-4 py-2 '+(b.dataset.track===track?'bg-blue-600 text-white':'text-slate-600 hover:bg-slate-50');
  });
}

function renderSectors(){
  const arrow=v=>+v>0?'▲':(+v<0?'▼':'—');
  document.getElementById('secGrid').innerHTML=(DATA.sectors||[]).map(s=>`
    <div class="bg-white rounded-xl border border-slate-200 shadow-sm px-3 py-2.5 flex items-center justify-between" title="成分：${(s.tickers||[]).join(', ')}">
      <div class="flex items-center gap-1.5 min-w-0"><span class="text-lg">${s.icon}</span><span class="text-sm font-medium truncate">${s.name}</span></div>
      <span class="text-sm font-semibold whitespace-nowrap ${cls(s.chg_pct)}">${arrow(s.chg_pct)}${sign(s.chg_pct)}</span>
    </div>`).join('');
}

function renderCards(){
  document.getElementById('idxCards').innerHTML=Object.entries(DATA.indices).map(([k,v])=>{
    const adv=DATA.advice[k]||{};
    return `<div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 flex items-center justify-between">
      <div>
        <div class="text-sm text-slate-500">${v.name} <span class="text-xs">(${v.time||''})</span></div>
        <div class="text-2xl font-bold mt-1">${fmt(v.price)}</div>
      </div>
      <div class="text-right">
        <div class="text-xl font-bold ${cls(v.chg_pct)}">${sign(v.chg_pct)}</div>
        <div class="mt-1">${adviceBadge(adv.action||'--')}</div>
        <div class="text-xs text-slate-400 mt-1 max-w-[180px]">${adv.reason||''}</div>
      </div>
    </div>`;
  }).join('');
}

fetch('data.json').then(r=>r.json()).then(d=>{
  DATA=d;
  document.getElementById('updated').textContent='更新于 '+(d.updated||'').replace('T',' ');
  renderCards(); renderSectors(); render();
});
document.getElementById('secToggle').addEventListener('click',()=>{
  const g=document.getElementById('secGrid');
  const hidden=g.style.display==='none';
  g.style.display=hidden?'':'none';
  document.getElementById('secToggle').textContent=hidden?'收起 ▴':'展开 ▾';
});
document.getElementById('tabs').addEventListener('click',e=>{if(e.target.dataset.track){track=e.target.dataset.track;render();}});
document.getElementById('q').addEventListener('input',render);
document.getElementById('offOnly').addEventListener('change',render);
document.querySelectorAll('th[data-sort]').forEach(th=>th.addEventListener('click',()=>{
  const k=th.dataset.sort; if(sortKey===k)sortDesc=!sortDesc; else{sortKey=k;sortDesc=true;} render();
}));
</script>
</body>
</html>
